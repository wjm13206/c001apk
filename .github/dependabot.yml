version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      android-build-tools:
        patterns:
          - "com.android.tools.build:gradle"
          - "org.jetbrains.kotlin:*"
          - "com.google.dagger:*"
